<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NAP ALL · Serveur 171</title><style>
:root{--bg:#f4f6fa;--surface:#fff;--line:#d9dfe9;--fg:#14202e;--muted:#55637a;--accent:#a9731a;--ban:#14233b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--surface:#111c30;--line:#233250;--fg:#e8edf6;--muted:#9fb0c9;--accent:#e8b02f;--ban:#0e1a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1220;--surface:#111c30;--line:#233250;--fg:#e8edf6;--muted:#9fb0c9;--accent:#e8b02f;--ban:#0e1a2e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 8px}.top small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.top select{font:inherit;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ban{background:var(--ban);color:#fff;border-radius:14px;padding:22px;border-bottom:4px solid var(--accent)}.ban h1{margin:0 0 6px;font-size:clamp(30px,6vw,46px);line-height:1.05;color:#fff;text-wrap:balance}.ban h1 b{color:#e8b02f}.ban p{margin:0;color:#c9d6ea;font-size:17px}
.sub{color:var(--muted);margin:18px 0 0}
.r{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}.r .no{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#14202e;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;align-self:start}.r h3{margin:0 0 6px;font-size:21px}.r p{margin:0 0 8px;font-size:15px;color:var(--muted)}.r .im{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.r .im img{max-width:150px;max-height:110px;width:auto;height:auto;border-radius:8px}
.rk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.rk span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.by{margin-top:16px;text-align:center;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px}.by b{display:block;font-size:24px;color:var(--accent);margin-top:4px}
.fr{margin-top:26px}.fr iframe{width:100%;border:0;display:block;min-height:500px;background:transparent}
@media(max-width:640px){.r{grid-template-columns:40px minmax(0,1fr)}.r .im{grid-column:1/-1;justify-content:flex-start}}
</style></head><body><main><div class="top"><small id="kick"></small><select id="lg" aria-label="Language"></select></div><div id="nap"></div><div class="fr" id="zone"></div></main><script>var NAP={"fr": {"t": "Règlement NAP ALL S171", "sub": "Non-Agression Pact All : le pacte entre les alliances du serveur 171.", "h": ["Priorité au serveur", "Pas d'attaques sur joueurs nommés", "Attaques autorisées sur les comptes « Commander »", "Serveur contre Serveur", "Les villes par rang", "Coup pour coup", "Les tuiles", "Trois avertissements"], "p": [[], [], [], ["Une fois le mode Serveur contre Serveur lancé, tous les joueurs doivent attaquer les camions, les trains et les opérations spéciales du serveur ennemi.", "Ils disposent d'une période d'apprentissage de deux semaines. Si votre camion est touché, vous pouvez en demander un autre de valeur équivalente au joueur responsable."], ["Au sein des alliances, les villes sont réparties par rang :", "Des ajustements de rangs pourront survenir, dans l'optique de bâtir un serveur sain et uni. En cas de modification, le rang devra être conservé pendant deux semaines avant que toute rotation de villes ne puisse avoir lieu. Toutes les alliances ayant accepté ces conditions s'engagent à ne pas s'y opposer le moment venu ; c'est une question d'équité."], ["Les attaques entre joueurs suivent la règle du « coup pour coup ». Cela signifie que si vous êtes attaqué, vous devez doubler la riposte : 1 attaque reçue = 2 attaques en retour ; 2 reçues = 4 en retour, et ainsi de suite.", "Au sein d'une alliance figurant dans le top 10, les membres de rang R5/R4 doivent se concerter avant toute riposte, afin de s'assurer que les autres joueurs ne viennent pas renforcer le ciblé."], ["Les attaques ciblant les tuiles relèvent de la règle « coup pour coup », avec une pénalité accrue :", "1 attaque reçue = 3 attaques en retour."], ["Le système des « trois avertissements » est en vigueur. Si un même joueur a attaqué votre alliance à trois reprises, vous êtes en droit de réduire sa base à zéro.", "Veuillez vous coordonner au préalable avec les membres de rang R5 ou R4 afin de garantir qu'aucun tiers ne soit touché."]], "rk": ["rang 6 = top 3", "rang 5 = top 4", "rang 4 = top 7"], "foot": "Règlement NAP ALL créé et validé par le top 5 :"}, "en": {"t": "NAP ALL Rules S171", "sub": "Non-Aggression Pact All: the pact between the alliances of server 171.", "h": ["Server first", "No attacks on named players", "Attacks allowed on “Commander” accounts", "Server vs Server", "Cities by rank", "Tit for tat", "Tiles", "Three warnings"], "p": [[], [], [], ["Once Server vs Server mode starts, all players must attack the enemy server's trucks, trains and special operations.", "There is a two-week learning period. If your truck is hit, you can ask the responsible player for another one of equivalent value."], ["Within alliances, cities are shared out by rank:", "Rank adjustments may happen, with the aim of building a healthy, united server. If a rank changes, it must be kept for two weeks before any city rotation can take place. All alliances that accepted these terms commit not to oppose this when the time comes; it is a matter of fairness."], ["Attacks between players follow the “tit for tat” rule. If you are attacked, you must double the response: 1 attack received = 2 attacks back; 2 received = 4 back, and so on.", "In an alliance in the top 10, R5/R4 members must consult each other before any retaliation, to make sure other players do not reinforce the target."], ["Attacks on tiles also follow the “tit for tat” rule, with a heavier penalty:", "1 attack received = 3 attacks back."], ["The “three warnings” system is in force. If the same player has attacked your alliance three times, you are entitled to reduce their base to zero.", "Please coordinate beforehand with R5 or R4 members so that no third party is hit."]], "rk": ["rank 6 = top 3", "rank 5 = top 4", "rank 4 = top 7"], "foot": "NAP ALL rules created and approved by the top 5:"}, "de": {"t": "NAP-ALL-Regeln S171", "sub": "Non-Aggression Pact All: der Pakt zwischen den Allianzen von Server 171.", "h": ["Server zuerst", "Keine Angriffe auf namentlich genannte Spieler", "Angriffe auf „Commander“-Konten erlaubt", "Server gegen Server", "Städte nach Rang", "Wie du mir, so ich dir", "Kacheln", "Drei Verwarnungen"], "p": [[], [], [], ["Sobald der Modus Server gegen Server beginnt, müssen alle Spieler die Lkw, Züge und Spezialoperationen des gegnerischen Servers angreifen.", "Es gibt eine Lernphase von zwei Wochen. Wird dein Lkw getroffen, kannst du beim verantwortlichen Spieler einen gleichwertigen anderen verlangen."], ["Innerhalb der Allianzen werden die Städte nach Rang verteilt:", "Rangänderungen sind möglich, um einen gesunden, geeinten Server aufzubauen. Bei einer Änderung muss der Rang zwei Wochen lang beibehalten werden, bevor eine Städterotation stattfinden darf. Alle Allianzen, die diese Bedingungen akzeptiert haben, verpflichten sich, sich dem zu gegebener Zeit nicht zu widersetzen; es ist eine Frage der Fairness."], ["Angriffe zwischen Spielern folgen der Regel „Wie du mir, so ich dir“. Wirst du angegriffen, musst du doppelt zurückschlagen: 1 erhaltener Angriff = 2 Gegenangriffe; 2 erhalten = 4 zurück usw.", "In einer Allianz der Top 10 müssen sich die R5/R4-Mitglieder vor jeder Vergeltung abstimmen, damit andere Spieler das Ziel nicht verstärken."], ["Angriffe auf Kacheln fallen ebenfalls unter diese Regel, mit höherer Strafe:", "1 erhaltener Angriff = 3 Gegenangriffe."], ["Das System der „drei Verwarnungen“ gilt. Hat derselbe Spieler deine Allianz dreimal angegriffen, darfst du seine Basis auf null reduzieren.", "Bitte stimme dich vorher mit R5- oder R4-Mitgliedern ab, damit kein Dritter getroffen wird."]], "rk": ["Rang 6 = Top 3", "Rang 5 = Top 4", "Rang 4 = Top 7"], "foot": "NAP-ALL-Regeln erstellt und bestätigt von den Top 5:"}, "es": {"t": "Reglamento NAP ALL S171", "sub": "Non-Aggression Pact All: el pacto entre las alianzas del servidor 171.", "h": ["Prioridad al servidor", "Sin ataques a jugadores nombrados", "Ataques permitidos a cuentas «Commander»", "Servidor contra Servidor", "Ciudades por rango", "Ojo por ojo", "Casillas", "Tres advertencias"], "p": [[], [], [], ["Una vez iniciado el modo Servidor contra Servidor, todos los jugadores deben atacar los camiones, los trenes y las operaciones especiales del servidor enemigo.", "Hay un periodo de aprendizaje de dos semanas. Si tu camión es atacado, puedes pedir otro de valor equivalente al jugador responsable."], ["Dentro de las alianzas, las ciudades se reparten por rango:", "Podrán producirse ajustes de rango, con el fin de construir un servidor sano y unido. Si hay un cambio, el rango deberá mantenerse dos semanas antes de que pueda haber cualquier rotación de ciudades. Todas las alianzas que aceptaron estas condiciones se comprometen a no oponerse llegado el momento; es una cuestión de equidad."], ["Los ataques entre jugadores siguen la regla del «ojo por ojo». Si te atacan, debes duplicar la respuesta: 1 ataque recibido = 2 ataques de vuelta; 2 recibidos = 4 de vuelta, y así sucesivamente.", "En una alianza del top 10, los miembros R5/R4 deben ponerse de acuerdo antes de responder, para asegurarse de que otros jugadores no refuercen al objetivo."], ["Los ataques a casillas siguen la regla del «ojo por ojo», con una penalización mayor:", "1 ataque recibido = 3 ataques de vuelta."], ["Está en vigor el sistema de «tres advertencias». Si un mismo jugador ha atacado a tu alianza tres veces, tienes derecho a reducir su base a cero.", "Coordínate antes con los miembros R5 o R4 para garantizar que no se golpee a ningún tercero."]], "rk": ["rango 6 = top 3", "rango 5 = top 4", "rango 4 = top 7"], "foot": "Reglamento NAP ALL creado y validado por el top 5:"}, "it": {"t": "Regolamento NAP ALL S171", "sub": "Non-Aggression Pact All: il patto tra le alleanze del server 171.", "h": ["Priorità al server", "Niente attacchi a giocatori nominati", "Attacchi consentiti sugli account «Commander»", "Server contro Server", "Città per grado", "Occhio per occhio", "Tessere", "Tre avvertimenti"], "p": [[], [], [], ["Una volta avviata la modalità Server contro Server, tutti i giocatori devono attaccare i camion, i treni e le operazioni speciali del server nemico.", "C'è un periodo di apprendimento di due settimane. Se il tuo camion viene colpito, puoi chiederne un altro di valore equivalente al giocatore responsabile."], ["All'interno delle alleanze, le città sono distribuite per grado:", "Potranno esserci aggiustamenti di grado, con l'obiettivo di costruire un server sano e unito. In caso di modifica, il grado dovrà essere mantenuto per due settimane prima di qualsiasi rotazione di città. Tutte le alleanze che hanno accettato queste condizioni si impegnano a non opporsi al momento opportuno; è una questione di equità."], ["Gli attacchi tra giocatori seguono la regola dell'«occhio per occhio». Se vieni attaccato, devi raddoppiare la risposta: 1 attacco subito = 2 attacchi di ritorno; 2 subiti = 4 di ritorno, e così via.", "In un'alleanza della top 10, i membri R5/R4 devono consultarsi prima di ogni ritorsione, per assicurarsi che altri giocatori non rinforzino il bersaglio."], ["Gli attacchi alle tessere seguono la regola dell'«occhio per occhio», con una penalità maggiore:", "1 attacco subito = 3 attacchi di ritorno."], ["È in vigore il sistema dei «tre avvertimenti». Se lo stesso giocatore ha attaccato la tua alleanza tre volte, hai il diritto di ridurre la sua base a zero.", "Coordinati prima con i membri R5 o R4 per garantire che nessun terzo venga colpito."]], "rk": ["grado 6 = top 3", "grado 5 = top 4", "grado 4 = top 7"], "foot": "Regolamento NAP ALL creato e approvato dalla top 5:"}, "tr": {"t": "NAP ALL Kuralları S171", "sub": "Non-Aggression Pact All: 171. sunucudaki ittifaklar arasındaki anlaşma.", "h": ["Önce sunucu", "İsmi geçen oyunculara saldırı yok", "«Commander» hesaplarına saldırı serbest", "Sunucu Sunucuya karşı", "Rütbeye göre şehirler", "Karşılığını ver", "Karolar", "Üç uyarı"], "p": [[], [], [], ["Sunucu Sunucuya karşı modu başladığında tüm oyuncular düşman sunucunun kamyonlarına, trenlerine ve özel operasyonlarına saldırmalıdır.", "İki haftalık bir öğrenme dönemi vardır. Kamyonun vurulursa, sorumlu oyuncudan eşdeğer değerde başka bir kamyon isteyebilirsin."], ["İttifaklar içinde şehirler rütbeye göre dağıtılır:", "Sağlıklı ve birleşik bir sunucu kurmak amacıyla rütbe ayarlamaları olabilir. Değişiklik olursa, herhangi bir şehir rotasyonundan önce rütbe iki hafta korunmalıdır. Bu koşulları kabul eden tüm ittifaklar, zamanı geldiğinde buna karşı çıkmamayı taahhüt eder; bu bir adalet meselesidir."], ["Oyuncular arasındaki saldırılar «karşılığını ver» kuralına uyar. Saldırıya uğrarsan karşılığı iki katı olmalıdır: 1 saldırı = 2 karşı saldırı; 2 saldırı = 4 karşı saldırı, böyle devam eder.", "İlk 10'daki bir ittifakta R5/R4 üyeleri, başka oyuncuların hedefi güçlendirmemesi için her karşılıktan önce kendi aralarında görüşmelidir."], ["Karolara yapılan saldırılar da «karşılığını ver» kuralına tabidir, ancak daha ağır cezayla:", "1 saldırı = 3 karşı saldırı."], ["«Üç uyarı» sistemi yürürlüktedir. Aynı oyuncu ittifakına üç kez saldırdıysa, üssünü sıfırlama hakkın vardır.", "Üçüncü bir tarafın vurulmaması için önce R5 veya R4 üyeleriyle koordine ol."]], "rk": ["rütbe 6 = ilk 3", "rütbe 5 = ilk 4", "rütbe 4 = ilk 7"], "foot": "NAP ALL kuralları ilk 5 tarafından hazırlandı ve onaylandı:"}, "ru": {"t": "Правила NAP ALL S171", "sub": "Non-Aggression Pact All: пакт между альянсами сервера 171.", "h": ["Сервер прежде всего", "Не атаковать названных игроков", "Разрешены атаки на аккаунты «Commander»", "Сервер против сервера", "Города по рангам", "Око за око", "Тайлы", "Три предупреждения"], "p": [[], [], [], ["Когда начинается режим «сервер против сервера», все игроки должны атаковать грузовики, поезда и спецоперации вражеского сервера.", "Есть двухнедельный период обучения. Если ваш грузовик атакован, вы можете попросить у виновного игрока другой, равной стоимости."], ["Внутри альянсов города распределяются по рангам:", "Возможны изменения рангов, чтобы построить здоровый и сплочённый сервер. При изменении ранг нужно сохранять две недели, прежде чем возможна любая ротация городов. Все альянсы, принявшие эти условия, обязуются не возражать, когда придёт время; это вопрос справедливости."], ["Атаки между игроками подчиняются правилу «око за око». Если вас атаковали, ответ должен быть вдвое больше: 1 полученная атака = 2 ответные; 2 полученные = 4 ответные и так далее.", "В альянсе из топ-10 участники R5/R4 должны договориться перед любым ответом, чтобы другие игроки не усилили цель."], ["Атаки на тайлы тоже подчиняются правилу «око за око», но с повышенным штрафом:", "1 полученная атака = 3 ответные атаки."], ["Действует система «трёх предупреждений». Если один и тот же игрок атаковал ваш альянс три раза, вы вправе снизить его базу до нуля.", "Заранее согласуйте это с участниками R5 или R4, чтобы не задеть третьих лиц."]], "rk": ["ранг 6 = топ 3", "ранг 5 = топ 4", "ранг 4 = топ 7"], "foot": "Правила NAP ALL составлены и одобрены топ-5:"}, "ko": {"t": "NAP ALL 규정 S171", "sub": "Non-Aggression Pact All: 171 서버 연맹들 사이의 협정.", "h": ["서버 우선", "지명된 플레이어 공격 금지", "«Commander» 계정은 공격 허용", "서버 대 서버", "등급별 도시", "받은 만큼 돌려주기", "타일", "경고 3회"], "p": [[], [], [], ["서버 대 서버 모드가 시작되면 모든 플레이어는 적 서버의 트럭, 기차, 특수 작전을 공격해야 합니다.", "2주의 적응 기간이 있습니다. 내 트럭이 공격당하면 책임 플레이어에게 동등한 가치의 다른 트럭을 요청할 수 있습니다."], ["연맹 내에서 도시는 등급별로 나뉩니다:", "건강하고 단합된 서버를 만들기 위해 등급이 조정될 수 있습니다. 변경 시 도시 교대가 이루어지기 전에 등급을 2주간 유지해야 합니다. 이 조건에 동의한 모든 연맹은 때가 되었을 때 반대하지 않겠다고 약속합니다. 이것은 공정함의 문제입니다."], ["플레이어 간 공격은 «받은 만큼 돌려주기» 규칙을 따릅니다. 공격을 받으면 두 배로 반격해야 합니다: 1회 받으면 2회 반격, 2회 받으면 4회 반격, 이런 식입니다.", "상위 10위 연맹에서는 R5/R4가 반격 전에 서로 협의하여 다른 플레이어가 대상을 지원하지 않도록 해야 합니다."], ["타일 공격도 «받은 만큼 돌려주기» 규칙을 따르며 페널티가 더 큽니다:", "1회 받으면 3회 반격."], ["«경고 3회» 제도가 시행 중입니다. 같은 플레이어가 우리 연맹을 세 번 공격했다면 그의 기지를 0으로 만들 권리가 있습니다.", "제3자가 피해를 입지 않도록 먼저 R5 또는 R4와 조율해 주세요."]], "rk": ["6등급 = 상위 3", "5등급 = 상위 4", "4등급 = 상위 7"], "foot": "NAP ALL 규정은 상위 5가 만들고 승인했습니다:"}, "pt": {"t": "Regras NAP ALL S171", "sub": "Non-Aggression Pact All: o pacto entre as alianças do servidor 171.", "h": ["Prioridade ao servidor", "Sem ataques a jogadores nomeados", "Ataques permitidos em contas «Commander»", "Servidor contra Servidor", "Cidades por patente", "Olho por olho", "Peças do mapa", "Três avisos"], "p": [[], [], [], ["Quando o modo Servidor contra Servidor começar, todos os jogadores devem atacar os caminhões, os trens e as operações especiais do servidor inimigo.", "Há um período de aprendizado de duas semanas. Se o seu caminhão for atingido, você pode pedir outro de valor equivalente ao jogador responsável."], ["Dentro das alianças, as cidades são distribuídas por patente:", "Podem ocorrer ajustes de patente, com o objetivo de construir um servidor saudável e unido. Em caso de mudança, a patente deverá ser mantida por duas semanas antes de qualquer rotação de cidades. Todas as alianças que aceitaram estas condições se comprometem a não se opor quando chegar a hora; é uma questão de equidade."], ["Os ataques entre jogadores seguem a regra do «olho por olho». Se você for atacado, deve dobrar a resposta: 1 ataque recebido = 2 ataques de volta; 2 recebidos = 4 de volta, e assim por diante.", "Em uma aliança do top 10, os membros R5/R4 devem se consultar antes de qualquer retaliação, para garantir que outros jogadores não reforcem o alvo."], ["Os ataques a peças do mapa seguem a regra do «olho por olho», com penalidade maior:", "1 ataque recebido = 3 ataques de volta."], ["O sistema de «três avisos» está em vigor. Se o mesmo jogador atacou sua aliança três vezes, você tem o direito de reduzir a base dele a zero.", "Combine antes com os membros R5 ou R4 para garantir que nenhum terceiro seja atingido."]], "rk": ["patente 6 = top 3", "patente 5 = top 4", "patente 4 = top 7"], "foot": "Regras NAP ALL cria r alle.", "title": "NAP ALL · Server 171"}, "es": {"k": "Servidor 171 · Todas las alianzas", "b": "Entre alianzas del 171 no nos atacamos ni nos saqueamos. Lee este reglamento: vale para todos.", "title": "NAP ALL · Servidor 171"}, "it": {"k": "Server 171 · Tutte le alleanze", "b": "Tra alleanze del 171 non ci si attacca e non ci si saccheggia. Leggi questo regolamento: vale per tutti.", "title": "NAP ALL · Server 171"}, "tr": {"k": "171. sunucu · Tüm ittifaklar", "b": "171 ittifakları birbirine saldırmaz ve birbirini yağmalamaz. Lütfen bu kuralları oku: herkes için geçerlidir.", "title": "NAP ALL · 171. sunucu"}, "ru": {"k": "Сервер 171 · Все альянсы", "b": "Альянсы сервера 171 не атакуют и не грабят друг друга. Прочитайте правила: они для всех.", "title": "NAP ALL · Сервер 171"}, "pt": {"k": "Servidor 171 · Todas as alianças", "b": "Entre alianças do 171, não nos atacamos nem nos saqueamos. Leia estas regras: valem para todos.", "title": "NAP ALL · Servidor 171"}, "ko": {"k": "171 서버 · 모든 연맹", "b": "171 서버 연맹끼리는 공격도 약탈도 하지 않습니다. 모두에게 적용되는 규정이니 꼭 읽어 주세요.", "title": "NAP ALL · 171 서버"}};var LN={"fr": "Français", "pt": "Português", "en": "English", "de": "Deutsch", "es": "Español", "it": "Italiano", "tr": "Türkçe", "ru": "Русский", "ko": "한국어"};var ORDER=["fr", "pt", "en", "de", "es", "it", "tr", "ru", "ko"];var TRD={"en": {"Zone de guerre": "War Zone", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "The Capitol in the centre of server 171, its alliances around it, the VS servers all around.", "SERVEUR 171": "SERVER 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "Map: the Capitol in the centre of server 171, its 7 alliances around it, surrounded by enemy VS servers", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>171 neighbors (no fighting)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>Opposing VS servers", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "Between 171 alliances: no fighting.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: real combat against the other servers.", "Au pillage : on épargne le 171": "When looting: spare 171", "Pour aller sur un autre serveur, il y a deux moyens : le menu <b>« Camion de transport »<\/b>, ou un <b>lien partagé sur le tchat<\/b>, du type <b>[Stats:179 X:649 Y:1]<\/b> (le lien vert).": "There are two ways to go to another server: the <b>“Transport Truck”<\/b> menu, or a <b>link shared in the chat<\/b>, like <b>[Stats:179 X:649 Y:1]<\/b> (the green link).", "Touche un camion : sa fiche indique son serveur, ici <b>#179<\/b> (après « Nv.21 »). Le jeu annonce <b>« Transfert vers la zone de guerre : 179 »<\/b>, puis un rectangle orange en haut de l'écran, « Zone de guerre … 179 », confirme le serveur où tu es.": "Tap a truck: its card shows its server, here <b>#179<\/b> (after “Nv.21”). The game announces <b>“Transfer to the War Zone: 179”<\/b>, then an orange rectangle at the top of the screen, “War Zone … 179”, confirms the server you are on.", "Pendant le VS, on arrive parfois sur un serveur où l'on ne peut pas piller (bug ou choix du jeu, on ne sait pas). Dans ce cas, cherche un camion d'un autre serveur, par exemple <b>168<\/b>.": "During the VS, you sometimes land on a server where you can't loot (a bug or a game choice, we don't know). In that case, look for a truck from another server, for example <b>168<\/b>.", "Sur le tchat, on se donne des opérations spéciales à piller. Regarde le numéro après « Stats: » : <b>179<\/b> (ou un autre serveur que le nôtre), on peut piller ; <b>171<\/b>, la personne s'est trompée et <b>on ne pille surtout pas<\/b>.": "In the chat, people give each other special operations to loot. Look at the number after “Stats:”: <b>179<\/b> (or any server other than ours), we can loot; <b>171<\/b>, the person made a mistake and <b>we absolutely do not loot<\/b>.", "<b style=\"color:var(--red)\">Jamais le 171 :<\/b> ni les opérations spéciales du 171, ni les camions du 171. Coche la case « Exclure le Camion de transport de ce serveur ».": "<b style=\"color:var(--red)\">Never 171:<\/b> neither 171's special operations nor 171's trucks. Check the “Exclude this server's Transport Truck” box.", "✔ [Stats:179 …] : on peut piller": "✔ [Stats:179 …]: we can loot", "✘ Si le lien indique [Stats:171 …] : on ne pille pas.": "✘ If the link says [Stats:171 …]: we don't loot."}, "de": {"Zone de guerre": "Kriegszone", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "Das Kapitol in der Mitte von Server 171, seine Allianzen darum, die VS-Server ringsum.", "SERVEUR 171": "SERVER 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "Karte: das Kapitol in der Mitte von Server 171, seine 7 Allianzen darum, umgeben von gegnerischen VS-Servern", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Nachbarn der 171 (kein Kampf)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>Gegnerische VS-Server", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "Zwischen Allianzen des 171: kein Kampf.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: echter Kampf gegen die anderen Server.", "Au pillage : on épargne le 171": "Beim Plündern: die 171 verschonen", "Pour aller sur un autre serveur, il y a deux moyens : le menu <b>« Camion de transport »<\/b>, ou un <b>lien partagé sur le tchat<\/b>, du type <b>[Stats:179 X:649 Y:1]<\/b> (le lien vert)."  …]: plündern erlaubt", "✘ Si le lien indique [Stats:171 …] : on ne pille pas.": "✘ Zeigt der Link [Stats:171 …]: nicht plündern."}, "es": {"Zone de guerre": "Zona de guerra", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "El Capitolio en el centro del servidor 171, sus alianzas alrededor, los servidores del VS por todos lados.", "SERVEUR 171": "SERVIDOR 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "Mapa: el Capitolio en el centro del servidor 171, sus 7 alianzas alrededor, rodeado de servidores rivales del VS", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Vecinos del 171 (sin combate)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>Servidores rivales del VS", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "Entre alianzas del 171: sin combate.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: combate real contra los demás servidores.", "Au pillage : on épargne le 171": "En el saqueo: se perdona al 171", "Pour aller sur un autre serveur, il y a deux moyens : le menu <b>« Camion de transport »<\/b>, ou un <b>lien partagé sur le tchat<\/b>, du type <b>[Stats:179 X:649 Y:1]<\/b> (le lien vert).": "Para ir a otro servidor hay dos formas: el menú <b>«Camión de transporte»<\/b>, o un <b>enlace compartido en el chat<\/b>, del tipo <b>[Stats:179 X:649 Y:1]<\/b> (el enlace verde).", "Touche un camion : sa fiche indique son serveur, ici <b>#179<\/b> (après « Nv.21 »). Le jeu annonce <b>« Transfert vers la zone de guerre : 179 »<\/b>, puis un rectangle orange en haut de l'écran, « Zone de guerre … 179 », confirme le serveur où tu es.": "Toca un camión: su ficha indica su servidor, aquí <b>#179<\/b> (después , ni les camions du 171. Coche la case « Exclure le Camion de transport de ce serveur ».": "<b style=\"color:var(--red)\">Asla 171 değil:<\/b> ne 171'in özel operasyonları ne de 171'in kamyonları. «Bu sunucunun Nakliye Kamyonunu hariç tut» kutusunu işaretle.", "✔ [Stats:179 …] : on peut piller": "✔ [Stats:179 …]: yağmalanabilir", "✘ Si le lien indique [Stats:171 …] : on ne pille pas.": "✘ Bağlantıda [Stats:171 …] yazıyorsa: yağmalanmaz."}, "ru": {"Zone de guerre": "Зона войны", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "Капитолий в центре сервера 171, вокруг его альянсы, а вокруг них — серверы VS.", "SERVEUR 171": "СЕРВЕР 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "Карта: Капитолий в центре сервера 171, вокруг него 7 альянсов, вокруг — вражеские серверы VS", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Соседи по 171 (без боёв)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>Вражеские серверы VS", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "Между альянсами 171: без боёв.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: настоящие бои с другими серверами.", "Au pillage : on épargne le 171": "При грабеже щадим 171", "Pour aller sur un autre serveur, il y a deux moyens : le menu <b>« Camion de transport »<\/b>, ou un <b>lien partagé sur le tchat<\/b>, du type <b>[Stats:179 X:649 Y:1]<\/b> (le lien vert).": "Чтобы попасть на другой сервер, есть два способа: меню <b>«Транспортный грузовик»<\/b> или <b>ссылка из чата<\/b> вида <b>[Stats:179 X:649 Y:1]<\/b> (зелёная ссылка).", "Touche un camion : sa fiche indique son serveur, ici <b>#179<\/b> (après « Nv.21 »). Le jeu annonce <b>« Transfert vers la zone de guerre : 179 »<\/b>, puis un rectangle orange en haut de l'écran, « Zone de guerre … 179 », confirme le serveur où tu es.": "Нажми на грузовик: в его карточке указан сервер, здесь <b>#179<\/b> (после «Nv.21»). Игра объявляет <b>«Переход в зону войны: 179»<\/b>, затем оранжевый прямоугольник вверху экрана «Зона войны … 179» подтверждает, на каком ты сервере.", "Pendant le VS, on arrive parfois sur un serveur où l'on ne peut pas piller (bug ou choix du jeu, on ne sait pas). Dans ce cas, cherche un camion d'un autre serveur, par exemple <b>168<\/b>.": "Во время VS иногда попадаешь на сервер, где грабить нельзя (баг или решение игры, неизвестно). В таком случае поищи грузовик другого сервера, например <b>168<\/b>.", "Sur le tchat, on se donne des opérations spéciales à piller. Regarde le numéro après « Stats: » : <b>179<\/b> (ou un autre serveur que le nôtre), on peut piller ; <b>171<\/b>, la personne s'est trompée et <b>on ne pille surtout pas<\/b>.": "В чате нам дают особые операции для грабежа. Смотри на число после «Stats:»: <b>179<\/b> (или любой другой сервер, кроме нашего) — грабить можно; <b>171<\/b> — человек ошибся, и <b>грабить ни в коем случае нельзя<\/b>.", "<b style=\"color:var(--red)\">Jamais le 171 :<\/b> ni les opérations spéciales du 171, ni les camions du 171. Coche la case « Exclure le Camion de transport de ce serveur ».": "<b style=\"color:var(--red)\">Никогда не 171:<\/b> ни особые операции 171, ни грузовики 171. Поставь галочку «Исключить транспортный грузовик этого сервера».", "✔ [Stats:179 …] : on peut piller": "✔ [Stats:179 …]: грабить можно", "✘ Si le lien indique [Stats:171 …] : on ne pille pas.": "✘ Если в ссылке [Stats:171 …]: не грабим."}, "ko": {"Zone de guerre": "전쟁 지역", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "171 서버 중앙의 캐피톨, 그 주위의 연맹들, 가장 바깥에 VS 서버.", "SERVEUR 171": "서버 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "지도: 171 서버 중앙의 캐피톨, 그 주위의 연맹 7개, 바깥은 적 VS 서버", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>171의 이웃(전투 없음)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>VS 상대 서버", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "171 연맹끼리는 전투 없음.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: 다른 서버와는 실제 전투.", "Au pillage : on épargne le 171": "약탈 시: 171은 건드리지 않아요", "Pour aller sur un autre serveur, il y a deux moyens : le menu <b>« Camion de transport »<\/b>, ou un <b>lien partagé sur le tchat<\/b>, du type <b>[Stats:179 X:649 Y:1]<\/b> (le lien vert).": "다른 서버로 가는 방법은 두 가지예요. <b>“수송 트럭”<\/b> 메뉴, 또는 <b>채팅에 공유된 링크<\/b>(예: <b>[Stats:179 X:649 Y:1]<\/b>, 초록색 링크)예요.", "Touche un camion : sa fiche indique son serveur, ici <b>#179<\/b> (après « Nv.21 »). Le jeu annonce <b>« Transfert vers la zone de guerre : 179 »<\/b>, puis un rectangle orange en haut de l'écran, « Zone de guerre … 179 », confirme le serveur où tu es.": "트럭을 누르세요. 트럭 정보에 서버가 나와요. 여기서는 <b>#179<\/b>(“Nv.21” 뒤)예요. 게임이 <b>“전쟁 지역으로 이동: 179”<\/b>라고 알려 주고, 이어 화면 위쪽의 주황색 직사각형 “전쟁 지역 … 179”가 지금 있는 서버를 확인해 줘요.", "Pendant le VS, on arrive parfois sur un serveur où l'on ne peut pas piller (bug ou choix du jeu, on ne sait pas). Dans ce cas, cherche un camion d'un autre serveur, par exemple <b>168<\/b>.": "VS 중에 약탈할 수 없는 서버에 도착하는 경우가 있어요(버그인지 게임의 선택인지는 몰라요). 그럴 때는 다른 서버의 트럭을 찾으세요. 예를 들어 <b>168<\/b>이요.", "Sur le tchat, on se donne des opérations spéciales à piller. Regarde le numéro après « Stats: » : <b>179<\/b> (ou un autre serveur que le nôtre), on peut piller ; <b>171<\/b>, la personne s'est trompée et <b>on ne pille surtout pas<\/b>.": "채팅에서 서로 약탈할 특수 작전을 알려 줘요. “Stats:” 뒤의 번호를 확인하세요. <b>179<\/b>(또는 우리 서버가 아닌 다른 서버)면 약탈해도 돼요. <b>171<\/b>이면 상대가 실수한 거니까 <b>절대 약탈하지 마세요<\/b>.", "<b style=\"color:var(--red)\">Jamais le 171 :<\/b> ni les opérations spéciales du 171, ni les camions du 171. Coche la case « Exclure le Camion de transport de ce serveur ».": "<b style=\"color:var(--red)\">171은 절대 안 돼요:<\/b> 171의 특수 작전도, 171의 트럭도 안 됩니다. “이 서버의 수송 트럭 제외” 칸을 체크하세요.", "✔ [Stats:179 …] : on peut piller": "✔ [Stats:179 …]: 약탈해도 돼요", "✘ Si le lien indique [Stats:171 …] : on ne pille pas.": "✘ 링크가 [Stats:171 …]이면 약탈하지 않아요."}, "pt": {"Zone de guerre": "Zona de guerra", "Le Capitole au centre du serveur 171, ses alliances autour, les serveurs du VS tout autour.": "O Capitólio no centro do servidor 171, suas alianças ao redor e os servidores do VS por toda parte.", "SERVEUR 171": "SERVIDOR 171", "Carte : le Capitole au centre du serveur 171, ses 7 alliances autour, entouré de serveurs adverses du VS": "Mapa: o Capitólio no centro do servidor 171, suas 7 alianças ao redor, cercado por servidores adversários do VS", "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Voisins du 171 (pas de combat)": "<i style=\"background:var(--nb);outline:1px solid var(--l)\"><\/i>Vizinhos do 171 (sem combate)", "<i style=\"background:var(--red)\"><\/i>Serveurs adverses du VS": "<i style=\"background:var(--red)\"><\/i>Servidores adversários do VS", "Entre alliances du 171 : pas de combat.<br><b style=\"color:var(--red)\">⚔ VS<\/b> : combat réel contre les autres serveurs.": "Entre alianças do 171: sem combate.<br><b style=\"color:var(--red)\">⚔ VS<\/b>: combate real contra os outros servidores."}};var TRJS="(function(){\nvar INL={B:1,STRONG:1,I:1,EM:1,SPAN:1,CODE:1,SMALL:1,BR:1,A:1,SUP:1,SUB:1,U:1,MARK:1,TSPAN:1},SKIP={SCRIPT:1,STYLE:1,HEAD:1,TITLE:1,META:1,LINK:1,NOSCRIPT:1},ATT=['alt','aria-label','placeholder','title'];\nfunction norm(s){return String(s).replace(/\\s+/g,' ').trim()}\nfunction inlineOnly(e){for(var c=e.firstElementChild;c;c=c.nextElementSibling){if(!INL[c.tagName]||!inlineOnly(c))return false}return true}\nfunction hasText(
