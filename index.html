<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATna · Le pillage</title>
<style>
:root{--bg:#12151a;--fg:#ECEFF4;--gold:#F2B84B;--card:#1b2029}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}
header{padding:18px 16px 8px}h1{margin:0;font-size:22px;color:var(--gold);letter-spacing:1px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 16px}
nav button{background:var(--card);color:var(--fg);border:2px solid #3a3320;border-radius:999px;padding:10px 16px;font-size:16px;min-width:56px}
nav button[aria-pressed=true]{background:var(--gold);color:#12151a;border-color:var(--gold);font-weight:700}
main{max-width:760px;margin:0 auto;padding:8px 16px 24px}
img{width:100%;height:auto;border-radius:12px;display:block}
a.dl{display:inline-block;margin-top:14px;color:var(--gold);font-size:16px}
</style></head><body>
<header><h1>[ATNA] · Le pillage</h1></header>
<nav id="nav"></nav>
<main><a id="open" href="#" target="_blank" rel="noopener"><img id="img" alt="Fiche pillage"></a><a id="dl" class="dl" download>Télécharger l’image</a></main>
<script>
var L=[["fr","Français"],["en","English"],["de","Deutsch"],["es","Español"],["it","Italiano"],["tr","Türkçe"],["ru","Русский"]];
var nav=document.getElementById("nav");
function show(c){var f="pillage-"+c+".png";document.getElementById("img").src=f;document.getElementById("open").href=f;document.getElementById("dl").href=f;document.documentElement.lang=c;
[].forEach.call(nav.children,function(b){b.setAttribute("aria-pressed",b.dataset.c===c)});try{location.hash=c}catch(e){}}
L.forEach(function(x){var b=document.createElement("button");b.textContent=x[1];b.dataset.c=x[0];b.onclick=function(){show(x[0])};nav.appendChild(b)});
var h=location.hash.slice(1),n=(navigator.language||"fr").slice(0,2);
show(L.some(function(x){return x[0]===h})?h:(L.some(function(x){return x[0]===n})?n:"fr"));
</script></body></html>
